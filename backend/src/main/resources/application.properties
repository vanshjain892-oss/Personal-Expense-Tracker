# Spring Boot application configuration
spring.application.name=expense-tracker

# Database configuration - update with your MySQL credentials
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT secret key (change this to a long random string in production)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Server port
server.port=8080

# Allow CORS from React frontend
spring.web.cors.allowed-origins=http://localhost:5173
